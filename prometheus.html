<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prometheus</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08090c;--panel:#0d0e14;--border:#16192a;--accent:#e8580a;--text:#d0d4e8;--muted:#353a55;--dim:#12141f}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:13px}
#app{display:grid;grid-template-rows:42px 1fr;height:100%}
#hdr{background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:12px}
.logo{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.1em;display:flex;align-items:center;gap:7px;flex-shrink:0}
.sep{width:1px;height:18px;background:var(--border);flex-shrink:0}
.pill{padding:2px 9px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.06em;flex-shrink:0}
.p-off{background:#0d0e14;color:var(--muted);border:1px solid var(--border)}
.p-live{background:#071a0d;color:#4ade80;border:1px solid #163d20}
.hstat{font-size:11px;color:var(--muted);white-space:nowrap}.hstat b{color:var(--text);font-weight:600}
#sp{flex:1}
.hbtn{padding:4px 11px;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:5px;cursor:pointer;font-size:11px;letter-spacing:.02em;transition:border-color .15s,color .15s}
.hbtn:hover{border-color:var(--accent);color:var(--accent)}
.hbtn.hi{border-color:var(--accent);color:var(--accent)}
#banner{display:none;padding:3px 14px;font-size:11px;font-weight:700;text-align:center;letter-spacing:.05em;flex-shrink:0}
#body{display:grid;grid-template-columns:1fr 188px;gap:1px;background:var(--border);overflow:hidden}
.pane{background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.ptitle{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);padding:5px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--panel)}
.ptitle em{font-size:10px;color:#4a5070;font-style:normal;text-transform:none;letter-spacing:0}
canvas#cvM{display:block;width:100%;flex:1;min-height:0;cursor:grab}
canvas#cvM:active{cursor:grabbing}
#sb{display:flex;flex-direction:column;gap:1px;background:var(--border);overflow-y:auto}
.sc{background:var(--panel);padding:10px 12px;flex-shrink:0}
.sc-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:7px}
.big{font-size:24px;font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--text)}
.unit{font-size:10px;color:var(--muted);margin-left:2px;font-weight:400}
.sub{font-size:10px;color:#353a55;margin-top:4px}
.gcard{background:var(--dim);border:1px solid var(--border);border-radius:5px;padding:8px 9px;margin-bottom:4px}
.gcard:last-child{margin-bottom:0}
.gc-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px}
.gc-val{font-size:16px;font-weight:700;line-height:1}
.gc-unit{font-size:9px;color:var(--muted);margin-left:2px;font-weight:400}
.gbar{height:2px;background:#0e1018;border-radius:1px;margin:6px 0 5px;overflow:hidden}
.gbf{height:100%;border-radius:1px;transition:width .5s cubic-bezier(.4,0,.2,1)}
#co-v{color:#e8580a}#no2-v{color:#a78bfa}#nh3-v{color:#22d3ee}
#co-f{background:#e8580a}#no2-f{background:#a78bfa}#nh3-f{background:#22d3ee}
.gst{font-size:9px;font-weight:700;padding:2px 6px;border-radius:6px;display:inline-block;letter-spacing:.04em}
.s-n{background:#071a0d;color:#4ade80;border:1px solid #163d20}
.s-c{background:#1a1000;color:#fb923c;border:1px solid #3d2500}
.s-d{background:#1a0505;color:#f87171;border:1px solid #3d1010}
.stat-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border)}
.stat-row:last-child{border:none}
.sk{font-size:10px;color:var(--muted)}.sv{font-size:10px;font-family:monospace;color:var(--text)}
.clrbtn{width:100%;padding:5px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:4px;cursor:pointer;font-size:11px;margin-top:8px;transition:all .15s}
.clrbtn:hover{border-color:#f87171;color:#f87171}
</style>
</head>
<body>
<div id="app">
<div id="hdr">
  <div class="logo">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
      <polygon points="8,1 15,13 1,13" stroke="#e8580a" stroke-width="1.5" fill="none"/>
      <circle cx="8" cy="9.5" r="1.8" fill="#e8580a"/>
      <line x1="8" y1="3.5" x2="8" y2="7.5" stroke="#e8580a" stroke-width="1.5"/>
    </svg>
    PROMETHEUS
  </div>
  <div class="sep"></div>
  <span class="pill p-off" id="badge">OFFLINE</span>
  <div class="hstat">Near <b id="h-near">—</b></div>
  <div class="hstat">Scans <b id="h-sc">0</b></div>
  <div class="hstat">FPS <b id="h-fps">—</b></div>
  <div id="sp"></div>
  <button class="hbtn hi" onclick="doConnect()">Connect Serial</button>
  <button class="hbtn" onclick="doDisconnect()">Disconnect</button>
  <button class="hbtn" onclick="clearAll()">Clear</button>
  <button class="hbtn" onclick="resetView()">Reset view</button>
</div>
<div id="banner"></div>
<div id="body">
  <div class="pane">
    <div class="ptitle">Smart map<em id="m-info">scroll = zoom · drag = pan</em></div>
    <canvas id="cvM"></canvas>
  </div>
  <div id="sb">
    <div class="sc">
      <div class="sc-lbl">Nearest obstacle</div>
      <div class="big" id="s-near">—<span class="unit">cm</span></div>
      <div class="sub" id="s-near-dir">—</div>
    </div>
    <div class="sc">
      <div class="sc-lbl">Air quality</div>
      <div class="gcard">
        <div class="gc-lbl">CO</div>
        <div class="gc-val" id="co-v">—<span class="gc-unit">ppm</span></div>
        <div class="gbar"><div class="gbf" id="co-f" style="width:0%"></div></div>
        <div class="gst s-n" id="co-s">Normal</div>
      </div>
      <div class="gcard">
        <div class="gc-lbl">NO₂</div>
        <div class="gc-val" id="no2-v">—<span class="gc-unit">ppm</span></div>
        <div class="gbar"><div class="gbf" id="no2-f" style="width:0%"></div></div>
        <div class="gst s-n" id="no2-s">Normal</div>
      </div>
      <div class="gcard">
        <div class="gc-lbl">NH₃</div>
        <div class="gc-val" id="nh3-v">—<span class="gc-unit">ppm</span></div>
        <div class="gbar"><div class="gbf" id="nh3-f" style="width:0%"></div></div>
        <div class="gst s-n" id="nh3-s">Normal</div>
      </div>
    </div>
    <div class="sc">
      <div class="sc-lbl">Stats</div>
      <div class="stat-row"><span class="sk">Scans</span><span class="sv" id="st-sc">0</span></div>
      <div class="stat-row"><span class="sk">Walls</span><span class="sv" id="st-walls">0</span></div>
      <div class="stat-row"><span class="sk">Zoom</span><span class="sv" id="st-mz">—</span></div>
      <button class="clrbtn" onclick="clearAll()">Clear map</button>
    </div>
  </div>
</div>
</div>
<script>
const cvM=document.getElementById('cvM'), ctxM=cvM.getContext('2d');

// ── Occupancy grid ────────────────────────────────────────────────────────────
const GRES=30, GSIZ=600, ORIG=GSIZ/2;
const grid=new Float32Array(GSIZ*GSIZ);
const WALL_HIT=4, WALL_MISS=-0.8, WALL_MAX=60, WALL_MIN=-30;
let mapScans=0, scanPts=[], wallCount=0;

function clearAll(){
  grid.fill(0); mapScans=0; scanPts=[]; wallCount=0;
  document.getElementById('st-sc').textContent='0';
  document.getElementById('h-sc').textContent='0';
  document.getElementById('st-walls').textContent='0';
}

function updateGrid(ang,dist){
  const rad=(ang-90)*Math.PI/180;
  const ex=Math.cos(rad)*dist/GRES, ey=Math.sin(rad)*dist/GRES;
  const gex=Math.round(ex+ORIG), gey=Math.round(ey+ORIG);
  let x=ORIG|0, y=ORIG|0;
  const dx=Math.abs(gex-x), dy=Math.abs(gey-y);
  const sx=x<gex?1:-1, sy=y<gey?1:-1;
  let err=dx-dy, steps=0, max=dx+dy+2;
  while(steps++<max){
    if(x===gex&&y===gey) break;
    if(x>=0&&x<GSIZ&&y>=0&&y<GSIZ){
      const i=y*GSIZ+x;
      grid[i]=Math.max(WALL_MIN, grid[i]+WALL_MISS);
    }
    const e2=2*err;
    if(e2>-dy){err-=dy;x+=sx;}
    if(e2<dx){err+=dx;y+=sy;}
  }
  if(gex>=0&&gex<GSIZ&&gey>=0&&gey<GSIZ){
    const i=gey*GSIZ+gex;
    const wasWall=grid[i]>=10;
    grid[i]=Math.min(WALL_MAX, grid[i]+WALL_HIT);
    if(!wasWall&&grid[i]>=10) wallCount++;
  }
}

// ── Canvas resize ─────────────────────────────────────────────────────────────
function resizeAll(){
  const p=cvM.parentElement;
  cvM.width=p.clientWidth;
  cvM.height=p.clientHeight-28;
}
window.addEventListener('resize',resizeAll);
setTimeout(resizeAll,40);

// ── View ──────────────────────────────────────────────────────────────────────
const v={x:0,y:0,sc:1};
function resetView(){v.x=cvM.width/2; v.y=cvM.height/2; v.sc=1;}
setTimeout(resetView,60);

let drag=false,dsx=0,dsy=0,dox=0,doy=0;
cvM.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY<0?1.12:.89;
  const rect=cvM.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  v.x=mx+(v.x-mx)*f; v.y=my+(v.y-my)*f;
  v.sc=Math.max(.05,Math.min(25,v.sc*f));
},{passive:false});
cvM.addEventListener('mousedown',e=>{drag=true;dsx=e.clientX;dsy=e.clientY;dox=v.x;doy=v.y;});
window.addEventListener('mousemove',e=>{if(!drag)return;v.x=dox+(e.clientX-dsx);v.y=doy+(e.clientY-dsy);});
window.addEventListener('mouseup',()=>drag=false);

// ── Smooth wall contour extraction ────────────────────────────────────────────
function getWallEdges(){
  const edges=[];
  for(let gy=1;gy<GSIZ-1;gy++){
    for(let gx=1;gx<GSIZ-1;gx++){
      const val=grid[gy*GSIZ+gx];
      if(val<10) continue;
      const adj=[grid[(gy-1)*GSIZ+gx],grid[(gy+1)*GSIZ+gx],grid[gy*GSIZ+gx-1],grid[gy*GSIZ+gx+1]];
      if(adj.some(a=>a<10)) edges.push([gx,gy,Math.min(1,val/WALL_MAX)]);
    }
  }
  return edges;
}

// ── Draw ──────────────────────────────────────────────────────────────────────
let lastEdges=[], edgeTimer=0;

function drawMap(){
  const W=cvM.width, H=cvM.height; if(!W||!H) return;
  ctxM.fillStyle='#08090c'; ctxM.fillRect(0,0,W,H);

  // Subtle grid
  const gridStep=Math.round(1000/GRES)*v.sc;
  if(gridStep>12){
    ctxM.strokeStyle='rgba(255,255,255,0.022)'; ctxM.lineWidth=1;
    const ox=(v.x%(gridStep)), oy=(v.y%(gridStep));
    for(let x=ox;x<W;x+=gridStep){ctxM.beginPath();ctxM.moveTo(x,0);ctxM.lineTo(x,H);ctxM.stroke();}
    for(let y=oy;y<H;y+=gridStep){ctxM.beginPath();ctxM.moveTo(0,y);ctxM.lineTo(W,y);ctxM.stroke();}
  }

  // Scale ring labels
  ctxM.font='9px monospace'; ctxM.textAlign='left'; ctxM.fillStyle='#252a40';
  for(let m=1;m<=8;m++){
    const r=m*1000/GRES*v.sc;
    ctxM.strokeStyle='rgba(255,255,255,0.035)'; ctxM.lineWidth=1;
    ctxM.beginPath(); ctxM.arc(v.x,v.y,r,0,Math.PI*2); ctxM.stroke();
    if(r>30) ctxM.fillText(m+'m',v.x+4,v.y-r+9);
  }

  // Free space (very subtle blue tint for explored areas)
  for(let gy=0;gy<GSIZ;gy++){
    for(let gx=0;gx<GSIZ;gx++){
      const val=grid[gy*GSIZ+gx];
      if(val>=-5&&val<10) continue;
      if(val<-5){
        const px=Math.round(v.x+(gx-ORIG)*v.sc), py=Math.round(v.y+(gy-ORIG)*v.sc);
        const cw=Math.max(1,Math.ceil(v.sc));
        if(px>=W||px+cw<0||py>=H||py+cw<0) continue;
        const t=Math.min(1,-val/WALL_MIN)*0.06;
        ctxM.fillStyle=`rgba(30,60,120,${t})`;
        ctxM.fillRect(Math.max(0,px),Math.max(0,py),Math.min(cw,W-px),Math.min(cw,H-py));
      }
    }
  }

  // Wall cells — rendered as smooth filled shapes
  if(Date.now()-edgeTimer>80){lastEdges=getWallEdges();edgeTimer=Date.now();}
  for(const[gx,gy,t] of lastEdges){
    const px=Math.round(v.x+(gx-ORIG)*v.sc), py=Math.round(v.y+(gy-ORIG)*v.sc);
    const cw=Math.max(1.5,Math.ceil(v.sc*1.1));
    if(px>=W||px+cw<0||py>=H||py+cw<0) continue;
    const alpha=0.55+t*0.45;
    const blue=Math.round(200+t*55);
    const green=Math.round(160+t*80);
    ctxM.fillStyle=`rgba(30,${green},${blue},${alpha})`;
    ctxM.fillRect(Math.max(0,px),Math.max(0,py),Math.min(cw,W-px),Math.min(cw,H-py));
  }

  // Direction line (forward = 0°, pointing up from robot)
  const dirLen=Math.min(W,H)*0.18;
  ctxM.strokeStyle='rgba(232,88,10,0.7)'; ctxM.lineWidth=1.5; ctxM.setLineDash([4,5]);
  ctxM.beginPath(); ctxM.moveTo(v.x,v.y); ctxM.lineTo(v.x,v.y-dirLen); ctxM.stroke();
  ctxM.setLineDash([]);
  ctxM.fillStyle='rgba(232,88,10,0.6)'; ctxM.font='9px monospace'; ctxM.textAlign='center';
  ctxM.fillText('0°',v.x,v.y-dirLen-5);

  // Robot
  ctxM.beginPath(); ctxM.arc(v.x,v.y,7,0,Math.PI*2);
  ctxM.fillStyle='rgba(232,88,10,0.12)'; ctxM.fill();
  ctxM.strokeStyle='#e8580a'; ctxM.lineWidth=1.5; ctxM.stroke();
  ctxM.beginPath(); ctxM.arc(v.x,v.y,2.5,0,Math.PI*2);
  ctxM.fillStyle='#e8580a'; ctxM.fill();

  // Scale bar
  const barM=v.sc*1000/GRES>=40?2:1;
  const bPx=barM*1000/GRES*v.sc;
  ctxM.strokeStyle='rgba(100,120,200,0.6)'; ctxM.lineWidth=1.5;
  ctxM.beginPath(); ctxM.moveTo(14,H-13); ctxM.lineTo(14+bPx,H-13); ctxM.stroke();
  ctxM.beginPath(); ctxM.moveTo(14,H-10); ctxM.lineTo(14,H-16); ctxM.stroke();
  ctxM.beginPath(); ctxM.moveTo(14+bPx,H-10); ctxM.lineTo(14+bPx,H-16); ctxM.stroke();
  ctxM.fillStyle='rgba(100,120,200,0.7)'; ctxM.font='9px monospace'; ctxM.textAlign='center';
  ctxM.fillText(barM+'m',14+bPx/2,H-4);

  // Nearest marker
  let nearest=null;
  for(const[ang,dist] of scanPts) if(!nearest||dist<nearest.d) nearest={ang,d:dist};
  if(nearest){
    const rad=(nearest.ang-90)*Math.PI/180;
    const px=v.x+Math.cos(rad)*nearest.d/GRES*v.sc;
    const py=v.y+Math.sin(rad)*nearest.d/GRES*v.sc;
    ctxM.strokeStyle='rgba(232,88,10,0.3)'; ctxM.lineWidth=1; ctxM.setLineDash([2,4]);
    ctxM.beginPath(); ctxM.moveTo(v.x,v.y); ctxM.lineTo(px,py); ctxM.stroke();
    ctxM.setLineDash([]);
    document.getElementById('s-near').innerHTML=(nearest.d/10).toFixed(0)+'<span class="unit">cm</span>';
    document.getElementById('s-near-dir').textContent=nearest.ang.toFixed(1)+'°  ·  '+(nearest.d/10).toFixed(0)+' cm';
    document.getElementById('h-near').textContent=(nearest.d/10).toFixed(0)+'cm';
  }

  document.getElementById('st-sc').textContent=mapScans;
  document.getElementById('h-sc').textContent=mapScans;
  document.getElementById('st-walls').textContent=wallCount;
  document.getElementById('st-mz').textContent=v.sc.toFixed(2)+'x';
  document.getElementById('m-info').textContent=mapScans+' scans · scroll=zoom · drag=pan';
}

// ── rAF loop ──────────────────────────────────────────────────────────────────
let fpsCnt=0, fpsLast=performance.now();
function loop(){
  drawMap();
  fpsCnt++;
  const now=performance.now();
  if(now-fpsLast>=1000){
    document.getElementById('h-fps').textContent=Math.round(fpsCnt*1000/(now-fpsLast));
    fpsCnt=0; fpsLast=now;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ── Gas ───────────────────────────────────────────────────────────────────────
const THR={co:{c:9,d:35},no2:{c:.1,d:1},nh3:{c:25,d:50}};
let gasMax={co:1,no2:.01,nh3:1};
function glv(v,k){return v>=THR[k].d?'danger':v>=THR[k].c?'caution':'normal';}
function updateGas(co,no2,nh3){
  gasMax.co=Math.max(gasMax.co,co*1.05+.01);
  gasMax.no2=Math.max(gasMax.no2,no2*1.05+.0001);
  gasMax.nh3=Math.max(gasMax.nh3,nh3*1.05+.01);
  const pct=(v,m)=>Math.min(100,v/m*100).toFixed(1)+'%';
  document.getElementById('co-v').innerHTML=co.toFixed(2)+'<span class="gc-unit">ppm</span>';
  document.getElementById('no2-v').innerHTML=no2.toFixed(4)+'<span class="gc-unit">ppm</span>';
  document.getElementById('nh3-v').innerHTML=nh3.toFixed(2)+'<span class="gc-unit">ppm</span>';
  document.getElementById('co-f').style.width=pct(co,gasMax.co);
  document.getElementById('no2-f').style.width=pct(no2,gasMax.no2);
  document.getElementById('nh3-f').style.width=pct(nh3,gasMax.nh3);
  const lv={co:glv(co,'co'),no2:glv(no2,'no2'),nh3:glv(nh3,'nh3')};
  const lbl={normal:'Normal',caution:'Caution',danger:'Danger'};
  const cls={normal:'s-n',caution:'s-c',danger:'s-d'};
  for(const[g,l] of Object.entries(lv)){
    const el=document.getElementById(g+'-s');
    el.className='gst '+cls[l]; el.textContent=lbl[l];
  }
  const worst=Object.values(lv).includes('danger')?'danger':Object.values(lv).includes('caution')?'caution':'normal';
  const ban=document.getElementById('banner');
  if(worst==='normal'){ban.style.display='none';}
  else{
    ban.style.display='block';
    ban.style.background=worst==='danger'?'#1a0505':'#1a1000';
    ban.style.color=worst==='danger'?'#f87171':'#fb923c';
    ban.style.borderBottom=worst==='danger'?'1px solid #3d1010':'1px solid #3d2500';
    ban.textContent=worst==='danger'?'DANGER — hazardous gas detected':'CAUTION — elevated gas levels';
  }
}

// ── Parse ─────────────────────────────────────────────────────────────────────
function parseLine(line){
  if(line.startsWith('L:')){
    const pts=line.slice(2).split(';').map(p=>{
      const[a,d]=p.split(',');
      let ang=parseFloat(a)%360; if(ang<0)ang+=360;
      return[ang,parseInt(d)];
    }).filter(([a,d])=>!isNaN(a)&&!isNaN(d)&&d>50&&d<12000);
    if(pts.length){
      scanPts=pts;
      for(const[a,d] of pts) updateGrid(a,d);
      mapScans++;
    }
  } else if(line.startsWith('G:')){
    const[co,no2,nh3]=line.slice(2).split(',').map(Number);
    if(!isNaN(co)) updateGas(co,no2,nh3);
  }
}

// ── WebSerial ─────────────────────────────────────────────────────────────────
let port=null, running=false;
function setOnline(on){
  document.getElementById('badge').textContent=on?'LIVE':'OFFLINE';
  document.getElementById('badge').className='pill '+(on?'p-live':'p-off');
}
async function doConnect(){
  if(!('serial' in navigator)){alert('Use Chrome or Edge.');return;}
  try{
    port=await navigator.serial.requestPort();
    await port.open({baudRate:115200});
    running=true; setOnline(true); readLoop();
  }catch(e){if(e.name!=='NotFoundError')alert('Failed: '+e.message);}
}
async function doDisconnect(){
  running=false;
  try{await port?.readable?.cancel();}catch{}
  try{await port?.close();}catch{}
  port=null; setOnline(false);
}
async function readLoop(){
  const dec=new TextDecoder(); let buf='';
  const reader=port.readable.getReader();
  try{
    while(running){
      const{value,done}=await reader.read(); if(done)break;
      buf+=dec.decode(value,{stream:true});
      buf=buf.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
      const last=buf.lastIndexOf('\n'); if(last===-1)continue;
      const block=buf.slice(0,last); buf=buf.slice(last+1);
      for(const raw of block.split('\n')){const l=raw.trim();if(l)parseLine(l);}
      if(buf.length>16000)buf='';
    }
  }catch(e){if(running)console.error(e);}
  finally{reader.releaseLock();setOnline(false);}
}
</script>
</body>
</html>
