<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prometheus</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08090c;--panel:#0e1016;--border:#181c28;--accent:#e8580a;--text:#d8dce8;--muted:#3a4060;--dim:#22263a}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:13px}
#app{display:grid;grid-template-rows:44px auto 1fr;height:100%}
#hdr{background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0}
.logo{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.08em;display:flex;align-items:center;gap:6px;flex-shrink:0}
.sep{width:1px;height:20px;background:var(--border);flex-shrink:0}
.hstat{font-size:11px;color:var(--muted);white-space:nowrap}.hstat b{color:var(--text)}
.pill{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.05em;flex-shrink:0}
.p-off{background:#0d0f14;color:var(--muted);border:1px solid var(--border)}
.p-live{background:#0d2a12;color:#4ade80;border:1px solid #1a5a22}
#sp{flex:1}
.hbtn{padding:4px 10px;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:5px;cursor:pointer;font-size:11px;transition:all .15s;white-space:nowrap}
.hbtn:hover{border-color:var(--accent);color:var(--accent)}
.hbtn.hi{border-color:var(--accent);color:var(--accent)}
#ws-status{font-size:10px;color:var(--muted);font-family:monospace}
#banner{display:none;padding:4px 14px;font-size:11px;font-weight:700;text-align:center;letter-spacing:.04em;flex-shrink:0}
#body{display:grid;grid-template-columns:1fr 192px;gap:1px;background:var(--border);overflow:hidden;min-height:0}
.pane{background:var(--bg);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.ptitle{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--panel)}
.ptitle em{font-size:10px;color:var(--text);font-style:normal;font-weight:600;text-transform:none;letter-spacing:0}
canvas{display:block;width:100%;flex:1;min-height:0;cursor:grab}
canvas:active{cursor:grabbing}
#sb{display:flex;flex-direction:column;gap:1px;background:var(--border);overflow-y:auto}
.sc{background:var(--panel);padding:10px 12px;flex-shrink:0}
.sc-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.big{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1}
.unit{font-size:10px;color:var(--muted);margin-left:2px}
.sub{font-size:10px;color:var(--muted);margin-top:3px}
.gcard{background:#0a0b10;border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:5px}
.gcard:last-child{margin-bottom:0}
.gc-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:3px}
.gc-val{font-size:17px;font-weight:700;line-height:1}
.gc-unit{font-size:9px;color:var(--muted);margin-left:2px;font-weight:400}
.gbar{height:3px;background:var(--dim);border-radius:2px;margin:5px 0 4px;overflow:hidden}
.gbf{height:100%;border-radius:2px;transition:width .4s}
#co-v{color:#e8580a}#no2-v{color:#a78bfa}#nh3-v{color:#22d3ee}
#co-f{background:#e8580a}#no2-f{background:#a78bfa}#nh3-f{background:#22d3ee}
.gst{font-size:9px;font-weight:700;padding:2px 6px;border-radius:8px;display:inline-block;letter-spacing:.04em}
.s-n{background:#0d2a12;color:#4ade80;border:1px solid #1a5a22}
.s-c{background:#2a1800;color:#fb923c;border:1px solid #5a3010}
.s-d{background:#2a0808;color:#f87171;border:1px solid #5a1010}
.stat-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border)}
.stat-row:last-child{border:none}
.sk{font-size:10px;color:var(--muted)}.sv{font-size:10px;font-family:monospace;color:var(--text)}
.clrbtn{width:100%;padding:5px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:4px;cursor:pointer;font-size:11px;margin-top:8px;transition:all .15s}
.clrbtn:hover{border-color:#f87171;color:#f87171}
</style>
</head>
<body>
<div id="app">
<div id="hdr">
  <div class="logo">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
      <polygon points="8,1 15,13 1,13" stroke="#e8580a" stroke-width="1.4" fill="none"/>
      <circle cx="8" cy="9.5" r="2" fill="#e8580a"/>
      <line x1="8" y1="4" x2="8" y2="7.5" stroke="#e8580a" stroke-width="1.4"/>
    </svg>
    PROMETHEUS
  </div>
  <div class="sep"></div>
  <span class="pill p-off" id="badge">OFFLINE</span>
  <span id="ws-status">click Connect Serial</span>
  <div class="hstat">Near <b id="h-near">—</b></div>
  <div class="hstat">Scans <b id="h-sc">0</b></div>
  <div class="hstat">FPS <b id="h-fps">—</b></div>
  <div id="sp"></div>
  <button class="hbtn hi" id="btnC" onclick="doConnect()">Connect Serial</button>
  <button class="hbtn" onclick="doDisconnect()">Disconnect</button>
  <button class="hbtn" onclick="clearGrid()">Clear map</button>
  <button class="hbtn" onclick="resetView()">Reset view</button>
</div>
<div id="banner"></div>
<div id="body">
  <div class="pane">
    <div class="ptitle">Memory map — occupancy grid<em id="m-info">scroll=zoom · drag=pan</em></div>
    <canvas id="cvM"></canvas>
  </div>
  <div id="sb">
    <div class="sc">
      <div class="sc-lbl">Nearest obstacle</div>
      <div class="big" id="s-near">—<span class="unit">cm</span></div>
      <div class="sub" id="s-near-dir">—</div>
    </div>
    <div class="sc">
      <div class="sc-lbl">Air quality — MICS-6814</div>
      <div class="gcard">
        <div class="gc-lbl">Carbon monoxide</div>
        <div class="gc-val" id="co-v">—<span class="gc-unit">ppm</span></div>
        <div class="gbar"><div class="gbf" id="co-f" style="width:0%"></div></div>
        <div class="gst s-n" id="co-s">Normal</div>
      </div>
      <div class="gcard">
        <div class="gc-lbl">Nitrogen dioxide</div>
        <div class="gc-val" id="no2-v">—<span class="gc-unit">ppm</span></div>
        <div class="gbar"><div class="gbf" id="no2-f" style="width:0%"></div></div>
        <div class="gst s-n" id="no2-s">Normal</div>
      </div>
      <div class="gcard">
        <div class="gc-lbl">Ammonia</div>
        <div class="gc-val" id="nh3-v">—<span class="gc-unit">ppm</span></div>
        <div class="gbar"><div class="gbf" id="nh3-f" style="width:0%"></div></div>
        <div class="gst s-n" id="nh3-s">Normal</div>
      </div>
    </div>
    <div class="sc">
      <div class="sc-lbl">Stats</div>
      <div class="stat-row"><span class="sk">Scans</span><span class="sv" id="st-sc">0</span></div>
      <div class="stat-row"><span class="sk">Map zoom</span><span class="sv" id="st-mz">—</span></div>
      <button class="clrbtn" onclick="clearGrid()">Clear map</button>
    </div>
  </div>
</div>
</div>
<script>
// ── Occupancy grid ────────────────────────────────────────────────────────────
const GRES=40, GSIZ=500, ORIG=GSIZ/2;
const grid=new Int8Array(GSIZ*GSIZ);
let mapScans=0, scanPts=[];

function clearGrid(){
  grid.fill(0); mapScans=0; scanPts=[];
  document.getElementById('st-sc').textContent='0';
  document.getElementById('h-sc').textContent='0';
}

function updateGrid(ang,dist){
  const rad=(ang-90)*Math.PI/180;
  const ex=Math.cos(rad)*dist/GRES, ey=Math.sin(rad)*dist/GRES;
  const gex=Math.round(ex+ORIG), gey=Math.round(ey+ORIG);
  let x=ORIG, y=ORIG;
  const dx=Math.abs(gex-x), dy=Math.abs(gey-y);
  const sx=x<gex?1:-1, sy=y<gey?1:-1;
  let err=dx-dy, steps=0, max=dx+dy;
  while(steps++<max){
    if(x===gex&&y===gey) break;
    if(x>=0&&x<GSIZ&&y>=0&&y<GSIZ){const i=y*GSIZ+x; if(grid[i]>-100)grid[i]=Math.max(-100,grid[i]-1);}
    const e2=2*err;
    if(e2>-dy){err-=dy;x+=sx;}
    if(e2<dx){err+=dx;y+=sy;}
  }
  if(gex>=0&&gex<GSIZ&&gey>=0&&gey<GSIZ){
    const i=gey*GSIZ+gex; if(grid[i]<100)grid[i]=Math.min(100,grid[i]+4);
  }
}

// ── Canvas ────────────────────────────────────────────────────────────────────
const cvM=document.getElementById('cvM');
const ctxM=cvM.getContext('2d');

function resizeAll(){
  const p=cvM.parentElement, h=p.clientHeight-30;
  cvM.width=p.clientWidth; cvM.height=Math.max(1,h);
}
window.addEventListener('resize',resizeAll);
setTimeout(resizeAll,60);

// ── View ──────────────────────────────────────────────────────────────────────
const vM={x:0,y:0,sc:0.9};
function resetView(){vM.x=cvM.width/2; vM.y=cvM.height/2; vM.sc=0.9;}
setTimeout(resetView,80);

let drag=false,sx=0,sy=0,ox=0,oy=0;
cvM.addEventListener('wheel',e=>{e.preventDefault();vM.sc=Math.max(.05,Math.min(20,vM.sc*(e.deltaY<0?1.15:.87)));},{passive:false});
cvM.addEventListener('mousedown',e=>{drag=true;sx=e.clientX;sy=e.clientY;ox=vM.x;oy=vM.y;});
window.addEventListener('mousemove',e=>{if(!drag)return;vM.x=ox+(e.clientX-sx);vM.y=oy+(e.clientY-sy);});
window.addEventListener('mouseup',()=>drag=false);

// ── Draw map ──────────────────────────────────────────────────────────────────
function drawMap(){
  const W=cvM.width, H=cvM.height; if(!W||!H) return;
  const v=vM;
  const img=ctxM.createImageData(W,H), d=img.data;
  for(let i=0;i<d.length;i+=4){d[i]=8;d[i+1]=9;d[i+2]=12;d[i+3]=255;}

  for(let gy=0;gy<GSIZ;gy++){
    for(let gx=0;gx<GSIZ;gx++){
      const val=grid[gy*GSIZ+gx]; if(!val) continue;
      const px=Math.round(v.x+(gx-ORIG)*v.sc), py=Math.round(v.y+(gy-ORIG)*v.sc);
      const cw=Math.max(1,Math.round(v.sc));
      if(px+cw<0||px>=W||py+cw<0||py>=H) continue;
      let r,g,b;
      if(val>0){const t=Math.min(1,val/80);r=20+Math.round(t*200);g=130+Math.round(t*100);b=255;}
      else{const t=Math.min(1,-val/60);r=0;g=10+15*t|0;b=20+20*t|0;}
      for(let qy=Math.max(0,py);qy<Math.min(H,py+cw);qy++)
        for(let qx=Math.max(0,px);qx<Math.min(W,px+cw);qx++){
          const i=(qy*W+qx)*4;d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=255;
        }
    }
  }
  ctxM.putImageData(img,0,0);

  // Grid lines
  const gS=Math.round(2000/GRES);
  ctxM.strokeStyle='rgba(255,255,255,.025)'; ctxM.lineWidth=1;
  for(let g=-ORIG;g<=ORIG;g+=gS){
    const sx=v.x+g*v.sc, sy=v.y+g*v.sc;
    ctxM.beginPath();ctxM.moveTo(sx,0);ctxM.lineTo(sx,H);ctxM.stroke();
    ctxM.beginPath();ctxM.moveTo(0,sy);ctxM.lineTo(W,sy);ctxM.stroke();
  }

  // Latest scan overlay
  let nearest=null;
  for(const[ang,dist] of scanPts){
    const rad=(ang-90)*Math.PI/180;
    const px=v.x+Math.cos(rad)*dist/GRES*v.sc, py=v.y+Math.sin(rad)*dist/GRES*v.sc;
    ctxM.fillStyle='rgba(251,191,36,.6)';
    ctxM.beginPath();ctxM.arc(px,py,1.6,0,Math.PI*2);ctxM.fill();
    if(!nearest||dist<nearest.d) nearest={ang,d:dist};
  }

  // Scale bar
  const bPx=2*1000/GRES*v.sc;
  ctxM.strokeStyle='#3b82f6'; ctxM.lineWidth=1.5;
  ctxM.beginPath();ctxM.moveTo(12,H-14);ctxM.lineTo(12+bPx,H-14);ctxM.stroke();
  ctxM.fillStyle='#3b82f6'; ctxM.font='9px monospace'; ctxM.textAlign='left';
  ctxM.fillText('2m',12+bPx/2-7,H-4);

  // Robot
  ctxM.fillStyle='rgba(232,88,10,.15)';ctxM.beginPath();ctxM.arc(v.x,v.y,7,0,Math.PI*2);ctxM.fill();
  ctxM.strokeStyle='#e8580a';ctxM.lineWidth=1.5;ctxM.beginPath();ctxM.arc(v.x,v.y,7,0,Math.PI*2);ctxM.stroke();

  // Stats
  if(nearest){
    document.getElementById('s-near').innerHTML=(nearest.d/10).toFixed(0)+'<span class="unit">cm</span>';
    document.getElementById('s-near-dir').textContent=nearest.ang.toFixed(1)+'°  ·  '+(nearest.d/10).toFixed(0)+' cm';
    document.getElementById('h-near').textContent=(nearest.d/10).toFixed(0)+'cm';
  }
  document.getElementById('st-sc').textContent=mapScans;
  document.getElementById('h-sc').textContent=mapScans;
  document.getElementById('st-mz').textContent=v.sc.toFixed(2)+'x';
  document.getElementById('m-info').textContent=mapScans+' scans · scroll=zoom · drag=pan';
}

// ── rAF loop ──────────────────────────────────────────────────────────────────
let fpsCnt=0, fpsLast=performance.now();
function loop(){
  drawMap();
  fpsCnt++;
  const now=performance.now();
  if(now-fpsLast>=1000){
    document.getElementById('h-fps').textContent=Math.round(fpsCnt*1000/(now-fpsLast));
    fpsCnt=0; fpsLast=now;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ── Gas ───────────────────────────────────────────────────────────────────────
const THR={co:{c:9,d:35},no2:{c:.1,d:1},nh3:{c:25,d:50}};
let gasMax={co:1,no2:.01,nh3:1};
function glv(v,k){return v>=THR[k].d?'danger':v>=THR[k].c?'caution':'normal';}
function updateGas(co,no2,nh3){
  gasMax.co=Math.max(gasMax.co,co*1.05+.01);
  gasMax.no2=Math.max(gasMax.no2,no2*1.05+.0001);
  gasMax.nh3=Math.max(gasMax.nh3,nh3*1.05+.01);
  const pct=(v,m)=>Math.min(100,v/m*100).toFixed(1)+'%';
  document.getElementById('co-v').innerHTML=co.toFixed(2)+'<span class="gc-unit">ppm</span>';
  document.getElementById('no2-v').innerHTML=no2.toFixed(4)+'<span class="gc-unit">ppm</span>';
  document.getElementById('nh3-v').innerHTML=nh3.toFixed(2)+'<span class="gc-unit">ppm</span>';
  document.getElementById('co-f').style.width=pct(co,gasMax.co);
  document.getElementById('no2-f').style.width=pct(no2,gasMax.no2);
  document.getElementById('nh3-f').style.width=pct(nh3,gasMax.nh3);
  const lv={co:glv(co,'co'),no2:glv(no2,'no2'),nh3:glv(nh3,'nh3')};
  const lbl={normal:'Normal',caution:'Caution',danger:'⚠ Danger'};
  const cls={normal:'s-n',caution:'s-c',danger:'s-d'};
  for(const[g,l] of Object.entries(lv)){
    const el=document.getElementById(g+'-s');
    el.className='gst '+cls[l]; el.textContent=lbl[l];
  }
  const worst=Object.values(lv).includes('danger')?'danger':Object.values(lv).includes('caution')?'caution':'normal';
  const ban=document.getElementById('banner');
  if(worst==='normal'){ban.style.display='none';}
  else{
    ban.style.display='block';
    ban.style.background=worst==='danger'?'#2a0808':'#2a1800';
    ban.style.color=worst==='danger'?'#f87171':'#fb923c';
    ban.style.borderBottom=worst==='danger'?'1px solid #5a1010':'1px solid #5a3010';
    ban.textContent=worst==='danger'?'⚠ DANGER — Hazardous gas levels detected':'⚠ CAUTION — Elevated gas levels';
  }
}

// ── Parse ─────────────────────────────────────────────────────────────────────
function parseLine(line){
  if(line.startsWith('L:')){
    const pts=line.slice(2).split(';').map(p=>{
      const parts=p.split(',');
      let ang=parseFloat(parts[0])%360;
      if(ang<0)ang+=360;
      return[ang,parseInt(parts[1])];
    }).filter(([a,d])=>!isNaN(a)&&!isNaN(d)&&d>50&&d<12000);
    if(pts.length){
      scanPts=pts;
      for(const[a,d] of pts) updateGrid(a,d);
      mapScans++;
    }
  } else if(line.startsWith('G:')){
    const parts=line.slice(2).split(',');
    const co=parseFloat(parts[0]),no2=parseFloat(parts[1]),nh3=parseFloat(parts[2]);
    if(!isNaN(co)) updateGas(co,no2,nh3);
  }
}

// ── WebSerial ─────────────────────────────────────────────────────────────────
let port=null, running=false;
function setOnline(on){
  const badge=document.getElementById('badge');
  const wss=document.getElementById('ws-status');
  if(on){badge.textContent='LIVE';badge.className='pill p-live';wss.textContent='connected';wss.style.color='#4ade80';}
  else{badge.textContent='OFFLINE';badge.className='pill p-off';wss.textContent='click Connect Serial';wss.style.color='';}
}
async function doConnect(){
  if(!('serial' in navigator)){alert('Use Chrome or Edge — WebSerial not supported in this browser.');return;}
  try{
    port=await navigator.serial.requestPort();
    await port.open({baudRate:115200});
    running=true; setOnline(true); readLoop();
  }catch(e){if(e.name!=='NotFoundError')alert('Connection failed: '+e.message);}
}
async function doDisconnect(){
  running=false;
  try{await port?.readable?.cancel();}catch{}
  try{await port?.close();}catch{}
  port=null; setOnline(false);
}
async function readLoop(){
  const dec=new TextDecoder(); let buf='';
  const reader=port.readable.getReader();
  try{
    while(running){
      const{value,done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      buf=buf.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
      const last=buf.lastIndexOf('\n'); if(last===-1) continue;
      const block=buf.slice(0,last); buf=buf.slice(last+1);
      for(const raw of block.split('\n')){const l=raw.trim();if(l)parseLine(l);}
      if(buf.length>16000) buf='';
    }
  }catch(e){if(running)console.error(e);}
  finally{reader.releaseLock();setOnline(false);}
}
</script>
</body>
</html>
