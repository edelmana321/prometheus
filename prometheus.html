<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Prometheus Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#111;color:#e0e0e0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#toolbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#1a1a1a;border-bottom:1px solid #333;flex-shrink:0}
#toolbar h1{font-size:14px;font-weight:600;color:#fff;margin-right:auto}
#status-dot{width:8px;height:8px;border-radius:50%;background:#555;flex-shrink:0}
#status-dot.connected{background:#16a34a}
#status-dot.error{background:#ef4444}
#status{font-size:12px;color:#888}
#demoBtn{padding:5px 12px;border-radius:6px;border:1px solid #2563eb;background:transparent;color:#2563eb;font-size:12px;cursor:pointer}
#demoBtn:hover{background:#1e3a5f}
#main{display:flex;flex:1;overflow:hidden}
#lidar-panel{flex:1;position:relative;background:#0d0d0d;display:flex;flex-direction:column}
canvas#lidar{flex:1;display:block;width:100%}
#debug-panel{height:72px;background:#0a0a0a;border-top:1px solid #1e1e1e;overflow-y:auto;padding:6px 10px;font-family:monospace;font-size:11px;color:#666;flex-shrink:0}
#debug-panel div{white-space:pre;line-height:1.5}
.dbg-L{color:#22d3ee}.dbg-G{color:#a78bfa}.dbg-err{color:#ef4444}.dbg-info{color:#888}
#sidebar{width:220px;background:#1a1a1a;border-left:1px solid #2a2a2a;display:flex;flex-direction:column;padding:12px;gap:10px;overflow-y:auto;flex-shrink:0}
.gas-card{background:#222;border-radius:8px;padding:10px 12px;border:1px solid #333}
.gas-card .lbl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.gas-card .val{font-size:22px;font-weight:600;color:#fff}
.gas-card .unit{font-size:11px;color:#666;margin-left:3px}
.bar-bg{height:4px;background:#333;border-radius:2px;margin-top:8px}
.bar-fill{height:4px;border-radius:2px;transition:width .4s}
.co-f{background:#f59e0b}.no2-f{background:#ef4444}.nh3-f{background:#a78bfa}
#alert-banner{display:none;padding:8px 12px;background:#7f1d1d;border-radius:6px;font-size:12px;color:#fca5a5;border:1px solid #991b1b}
#stats{font-size:11px;color:#555;line-height:1.8}
#stats span{color:#888}
.btn{padding:5px 10px;border-radius:6px;border:1px solid #444;background:transparent;color:#aaa;font-size:12px;cursor:pointer;width:100%}
.btn:hover{background:#2a2a2a}
.setting{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#888}
.setting input[type=range]{width:90px}
.setting span{min-width:28px;text-align:right;color:#ccc}
</style>
</head>
<body>
<div id="toolbar">
  <h1>Prometheus</h1>
  <div id="status-dot"></div>
  <span id="status">Connecting...</span>
  <button id="demoBtn">Demo</button>
</div>
<div id="main">
  <div id="lidar-panel">
    <canvas id="lidar"></canvas>
    <div id="debug-panel"><div class="dbg-info">— waiting for data —</div></div>
  </div>
  <div id="sidebar">
    <div id="alert-banner"></div>
    <div class="gas-card">
      <div class="lbl">CO</div>
      <div><span class="val" id="co-val">—</span><span class="unit">ppm</span></div>
      <div class="bar-bg"><div class="bar-fill co-f" id="co-bar" style="width:0%"></div></div>
    </div>
    <div class="gas-card">
      <div class="lbl">NO₂</div>
      <div><span class="val" id="no2-val">—</span><span class="unit">ppm</span></div>
      <div class="bar-bg"><div class="bar-fill no2-f" id="no2-bar" style="width:0%"></div></div>
    </div>
    <div class="gas-card">
      <div class="lbl">NH₃</div>
      <div><span class="val" id="nh3-val">—</span><span class="unit">ppm</span></div>
      <div class="bar-bg"><div class="bar-fill nh3-f" id="nh3-bar" style="width:0%"></div></div>
    </div>
    <div style="background:#222;border-radius:8px;padding:10px 12px;border:1px solid #333;display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.05em;align-self:flex-start">Heading</div>
      <svg id="compass" viewBox="0 0 80 80" width="80" height="80">
        <circle cx="40" cy="40" r="36" fill="none" stroke="#333" stroke-width="1"/>
        <text x="40" y="12" text-anchor="middle" font-size="9" fill="#555">N</text>
        <text x="40" y="72" text-anchor="middle" font-size="9" fill="#555">S</text>
        <text x="10" y="44" text-anchor="middle" font-size="9" fill="#555">W</text>
        <text x="70" y="44" text-anchor="middle" font-size="9" fill="#555">E</text>
        <line id="needle" x1="40" y1="40" x2="40" y2="10" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div style="font-size:12px;color:#888" id="heading-val">—°</div>
    </div>

    <div style="background:#222;border-radius:8px;padding:10px 12px;border:1px solid #333;display:flex;flex-direction:column;gap:8px">
      <div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.05em">Map settings</div>
      <div class="setting">Confidence<input type="range" id="s-conf" min="1" max="10" value="3"><span id="s-conf-v">3</span></div>
      <div class="setting">Decay<input type="range" id="s-decay" min="1" max="20" value="8"><span id="s-decay-v">8</span></div>
      <div class="setting">Range<input type="range" id="s-range" min="2" max="12" value="6"><span id="s-range-v">6m</span></div>
    </div>

    <div id="stats">Points: <span id="pt-count">0</span><br>Scans: <span id="scan-count">0</span><br>Last: <span id="last-time">—</span></div>
    <button class="btn" id="clearBtn">Clear map</button>
  </div>
</div>
<script>
const canvas=document.getElementById('lidar'), ctx=canvas.getContext('2d');
let scanCount=0, demoTimer=null, ws=null;
const THRESH={co:35,no2:0.1,nh3:25}, MAXBAR={co:200,no2:2,nh3:200};
let dbgLines=[];

// Occupancy grid
const GRID=400;        // cells per axis
let grid=new Int16Array(GRID*GRID); // hit count per cell
let freeGrid=new Int16Array(GRID*GRID); // free space votes
let settings={conf:3, decay:8, range:6000}; // range in mm

function gi(x,y){return y*GRID+x;}

// Bresenham line — mark free cells along ray
function bresenham(x0,y0,x1,y1,hitX,hitY){
  let dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
  let sx=x0<x1?1:-1, sy=y0<y1?1:-1, err=dx-dy;
  let cx=x0,cy=y0;
  while(true){
    if(cx===hitX&&cy===hitY) break;
    if(cx<0||cx>=GRID||cy<0||cy>=GRID) break;
    freeGrid[gi(cx,cy)]++;
    let e2=2*err;
    if(e2>-dy){err-=dy;cx+=sx;}
    if(e2<dx){err+=dx;cy+=sy;}
  }
}

function processScan(pts){
  const cx=GRID>>1, cy=GRID>>1;
  const cellSize=settings.range/GRID; // mm per cell

  // Decay all cells slightly
  const decayEvery=settings.decay;
  if(scanCount%decayEvery===0){
    for(let i=0;i<grid.length;i++){
      if(grid[i]>0) grid[i]--;
      if(freeGrid[i]>0) freeGrid[i]--;
    }
  }

  for(const [ang,dist] of pts){
    const rad=(ang-90)*Math.PI/180;
    const mmX=Math.cos(rad)*dist, mmY=Math.sin(rad)*dist;
    const gx=Math.round(cx+mmX/cellSize);
    const gy=Math.round(cy+mmY/cellSize);
    if(gx>=0&&gx<GRID&&gy>=0&&gy<GRID){
      grid[gi(gx,gy)]=Math.min(255,grid[gi(gx,gy)]+2);
      bresenham(cx,cy,gx,gy,gx,gy);
    }
  }

  scanCount++;
  document.getElementById('scan-count').textContent=scanCount;
  document.getElementById('last-time').textContent=new Date().toLocaleTimeString();

  // Compass
  if(pts.length){
    const avg=pts.reduce((s,p)=>s+p[0],0)/pts.length;
    const r=avg*Math.PI/180;
    const n=document.getElementById('needle');
    n.setAttribute('x2',(40+Math.sin(r)*28).toFixed(1));
    n.setAttribute('y2',(40-Math.cos(r)*28).toFixed(1));
    document.getElementById('heading-val').textContent=Math.round(avg)+'°';
  }

  // Count occupied cells for stats
  let occ=0;
  for(let i=0;i<grid.length;i++) if(grid[i]>=settings.conf) occ++;
  document.getElementById('pt-count').textContent=occ;

  draw();
}

function draw(){
  const W=canvas.width, H=canvas.height, dpr=devicePixelRatio;
  ctx.clearRect(0,0,W,H);
  const cx=W/2, cy=H/2;
  const cellSize=settings.range/GRID;
  const pxPerCell=Math.min(W,H)/GRID;

  // Grid rings
  ctx.strokeStyle='#1e1e1e'; ctx.lineWidth=1;
  for(let r=2000;r<=settings.range;r+=2000){
    const pr=r/cellSize*pxPerCell;
    ctx.beginPath(); ctx.arc(cx,cy,pr,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#3a3a3a'; ctx.font=`${10*dpr}px system-ui`;
    ctx.fillText((r/1000).toFixed(0)+'m',cx+pr+3,cy-2);
  }
  ctx.strokeStyle='#1a1a1a';
  ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,cy); ctx.lineTo(W,cy); ctx.stroke();

  const gcx=GRID>>1, gcy=GRID>>1;
  const conf=settings.conf;

  // Draw free space (very subtle)
  ctx.fillStyle='rgba(34,211,238,0.03)';
  for(let gy=0;gy<GRID;gy++){
    for(let gx=0;gx<GRID;gx++){
      if(freeGrid[gi(gx,gy)]>2&&grid[gi(gx,gy)]<conf){
        const px=cx+(gx-gcx)*pxPerCell;
        const py=cy+(gy-gcy)*pxPerCell;
        ctx.fillRect(px,py,pxPerCell,pxPerCell);
      }
    }
  }

  // Draw occupied cells — brighter = more confident
  for(let gy=0;gy<GRID;gy++){
    for(let gx=0;gx<GRID;gx++){
      const v=grid[gi(gx,gy)];
      if(v>=conf){
        const alpha=Math.min(1,0.4+(v-conf)*0.06);
        ctx.fillStyle=`rgba(34,211,238,${alpha.toFixed(2)})`;
        const px=cx+(gx-gcx)*pxPerCell;
        const py=cy+(gy-gcy)*pxPerCell;
        ctx.fillRect(px,py,Math.max(1.5,pxPerCell),Math.max(1.5,pxPerCell));
      }
    }
  }

  // Robot
  ctx.beginPath(); ctx.arc(cx,cy,5,0,Math.PI*2);
  ctx.fillStyle='#2563eb'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,12,0,Math.PI*2);
  ctx.strokeStyle='rgba(37,99,235,0.3)'; ctx.lineWidth=1; ctx.stroke();
}

function resize(){
  canvas.width=canvas.offsetWidth*devicePixelRatio;
  canvas.height=canvas.offsetHeight*devicePixelRatio;
  draw();
}

function updateGas(co,no2,nh3){
  document.getElementById('co-val').textContent=co.toFixed(1);
  document.getElementById('no2-val').textContent=no2.toFixed(3);
  document.getElementById('nh3-val').textContent=nh3.toFixed(1);
  document.getElementById('co-bar').style.width=Math.min(100,co/MAXBAR.co*100).toFixed(1)+'%';
  document.getElementById('no2-bar').style.width=Math.min(100,no2/MAXBAR.no2*100).toFixed(1)+'%';
  document.getElementById('nh3-bar').style.width=Math.min(100,nh3/MAXBAR.nh3*100).toFixed(1)+'%';
